name: Deploy demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Forks and repositories without the Cloudflare secrets skip the deploy instead of failing.
    if: ${{ github.repository == 'chobitapp/chobit-csv-editor' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the demo deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v6
      - if: steps.secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.configured == 'true'
        run: pnpm deploy:demo
